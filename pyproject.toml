[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "storage", "Pictures"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]
# Line length is black's job; it formats what it can and leaves the rest.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing the backend package,
# so their imports legitimately sit below module-level statements.
"scripts/*" = ["E402"]
# FastAPI's dependency-injection idiom is a call in an argument default.
"backend/app/api/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
exclude = '(^|/)(\.venv|storage|Pictures)/'
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Tests import the backend package by its absolute path from the repo root.
pythonpath = ["."]
